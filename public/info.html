<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RecipeForAll</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="web.html">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                </span>
                <span>Recipe<em>ForAll</em></span>
            </a>
            <a class="header-link" href="web.html">Search recipes</a>
        </div>
    </header>

    <main class="container">
        <a class="back-link" id="backLink" href="web.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back to recipes
        </a>

        <div id="loader" class="loader" role="status">
            <div class="spinner" aria-hidden="true"></div>
            <p>Gathering the ingredients...</p>
        </div>

        <div id="errorBox" class="panel error-box" role="alert" hidden>
            <h2>Hmm, that didn't work</h2>
            <p id="errorText"></p>
            <div class="detail-actions">
                <button type="button" id="retryBtn" class="btn btn-primary">Try again</button>
                <a class="btn btn-ghost" href="web.html">Back to search</a>
            </div>
        </div>

        <article id="recipe" class="recipe" hidden>
            <section class="detail-hero">
                <div class="detail-img"><img id="img1" alt=""></div>
                <div class="detail-info">
                    <div class="badges">
                        <span id="category" class="badge"></span>
                        <span id="area" class="badge dark"></span>
                    </div>
                    <h1 id="foodName" class="detail-title"></h1>
                    <p id="stats" class="stats"></p>
                    <div id="tags" class="tags"></div>
                    <div class="detail-actions">
                        <a id="videoLink" class="btn btn-primary" href="#video">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                            Watch the video
                        </a>
                        <button type="button" id="randomFood" class="btn btn-ghost">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
                            <span class="btn-label">Surprise me again</span>
                        </button>
                    </div>
                </div>
            </section>

            <div class="detail-body">
                <aside class="panel ingredients" aria-labelledby="ingredientsTitle">
                    <h2 id="ingredientsTitle">Ingredients</h2>
                    <p class="muted small">Tick them off as you gather them.</p>
                    <ul id="ingre:measure" class="ingredient-list"></ul>
                </aside>

                <section class="steps" aria-labelledby="stepsTitle">
                    <h2 id="stepsTitle">Instructions</h2>
                    <p class="muted small">Tap a step to mark it done.</p>
                    <ol id="instructions" class="step-list"></ol>
                </section>
            </div>

            <section id="video" class="video" aria-labelledby="videoTitle" hidden>
                <h2 id="videoTitle">Watch how it's made</h2>
                <div id="videoFrame" class="video-frame"></div>
            </section>
        </article>
    </main>

    <footer class="site-footer">
        <div class="container">Recipes and photos from TheMealDB.</div>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
